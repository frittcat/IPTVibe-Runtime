name: Sync IPTVibe runtime

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: runtime-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IPTVibe Runtime
        uses: actions/checkout@v4

      - name: Fetch authorized runtime data
        shell: bash
        env:
          IPTVIBE_UPSTREAM_REPO: ${{ secrets.IPTVIBE_UPSTREAM_REPO }}
          IPTVIBE_UPSTREAM_MONITOR: ${{ secrets.IPTVIBE_UPSTREAM_MONITOR }}
        run: |
          set -euo pipefail
          python3 preserve_categories.py runtime --capture-current
          tmp="${RUNNER_TEMP}/iptvibe-upstream"
          git clone --depth 1 "$IPTVIBE_UPSTREAM_REPO" "$tmp"

          mkdir -p runtime/monitor
          rm -rf runtime/vod
          cp -a "$tmp/vod" runtime/vod
          cp "$tmp/catalogo.txt" runtime/catalogo.txt
          cp "$tmp/canais.txt" runtime/canais.txt
          cp "$tmp/restritos.txt" runtime/restritos.txt

          sed -i '1c# IPTVIBE - LISTA DE CANAIS' runtime/catalogo.txt
          sed -i '1c# IPTVIBE - CANAIS RESTRITOS' runtime/restritos.txt

          curl --fail --silent --show-error             "$IPTVIBE_UPSTREAM_MONITOR"             -o runtime/monitor/fontes.json

      - name: Record upstream catalog revision and application changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 upstream_status.py --upstream "${RUNNER_TEMP}/iptvibe-upstream" --output runtime/upstream-status.json

      - name: Validate labels and highlighted explicit media sources
        # Playback qualification belongs exclusively to the owner's BlueStacks.
        run: python3 runtime_quality.py runtime

      - name: Test persistent source limits and retained categories
        run: python3 -m unittest test_sync_shortlist test_preserve_categories -v

      - name: Preserve IPTVibe 24-hour and Pluto channel inventory
        run: python3 preserve_categories.py runtime

      - name: Preserve reviewed live channel identities, source order and logos
        run: python3 live_overrides.py runtime --policy live-health.json

      - name: Commit runtime changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- runtime retained-categories.txt; then
            echo "Runtime already current"
            exit 0
          fi
          git config user.name "iptvibe-runtime-bot"
          git config user.email "137531366+frittcat@users.noreply.github.com"
          git add runtime retained-categories.txt
          git commit -m "runtime: sync IPTVibe catalog and sources"
          git push
